<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141824"/>
      <stop offset="50%" stop-color="#0d111a"/>
      <stop offset="100%" stop-color="#05070a"/>
    </linearGradient>

    <!-- Squircle Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00d2fc" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#38d9a9" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#ff4757" stop-opacity="0.6"/>
    </linearGradient>

    <!-- Jar Glass Gradient -->
    <linearGradient id="jarGlass" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.35)"/>
      <stop offset="25%" stop-color="rgba(0, 210, 252, 0.15)"/>
      <stop offset="70%" stop-color="rgba(0, 210, 252, 0.05)"/>
      <stop offset="100%" stop-color="rgba(56, 217, 169, 0.25)"/>
    </linearGradient>

    <!-- Neon Glow Gradient for Liquid -->
    <linearGradient id="liquidGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00d2fc"/>
      <stop offset="50%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#38ef7d"/>
    </linearGradient>

    <!-- Coin Gradient -->
    <linearGradient id="coinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe600"/>
      <stop offset="50%" stop-color="#ffb300"/>
      <stop offset="100%" stop-color="#ff8008"/>
    </linearGradient>

    <!-- Drop Shadow / Glow Filters -->
    <filter id="glowEffect" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="36" result="blur1"/>
      <feMerge>
        <feMergeNode in="blur1"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="shadowEffect" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="24" stdDeviation="32" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Base macOS App Squircle (Continuous curve radius) -->
  <rect x="64" y="64" width="896" height="896" rx="200" ry="200" fill="url(#bgGrad)" filter="url(#shadowEffect)"/>
  <rect x="64" y="64" width="896" height="896" rx="200" ry="200" fill="none" stroke="url(#borderGrad)" stroke-width="6"/>

  <!-- Ambient Glow Behind Jar -->
  <circle cx="512" cy="560" r="280" fill="#00d2fc" opacity="0.18" filter="url(#glowEffect)"/>
  <circle cx="460" cy="420" r="160" fill="#ffe600" opacity="0.15" filter="url(#glowEffect)"/>

  <!-- Glass Jar Container -->
  <!-- Jar Lid -->
  <rect x="400" y="270" width="224" height="40" rx="16" fill="rgba(255,255,255,0.75)" filter="url(#shadowEffect)"/>
  <rect x="424" y="310" width="176" height="24" rx="8" fill="rgba(255,255,255,0.3)"/>

  <!-- Jar Body -->
  <path d="M 330 350 
           L 694 350 
           C 740 350, 760 380, 760 430 
           L 760 710 
           C 760 790, 700 810, 630 810 
           L 394 810 
           C 324 810, 264 790, 264 710 
           L 264 430 
           C 264 380, 284 350, 330 350 Z" 
        fill="url(#jarGlass)" 
        stroke="rgba(255, 255, 255, 0.4)" 
        stroke-width="8" 
        filter="url(#shadowEffect)"/>

  <!-- Glowing Liquid Fill Inside Jar -->
  <path d="M 276 590 
           Q 380 560, 512 590 
           T 748 590 
           L 748 700 
           C 748 770, 690 794, 620 794 
           L 404 794 
           C 334 794, 276 770, 276 700 Z" 
        fill="url(#liquidGrad)" 
        opacity="0.88" 
        filter="url(#glowEffect)"/>

  <!-- Golden Floating Coin / Star Inside & Rising -->
  <g transform="translate(512, 450)" filter="url(#shadowEffect)">
    <circle cx="0" cy="0" r="92" fill="url(#coinGrad)" stroke="#fff" stroke-width="4"/>
    <circle cx="0" cy="0" r="74" fill="none" stroke="#e67e22" stroke-width="3" stroke-dasharray="8 6"/>
    <!-- Currency / CaltDHy Logo Symbol -->
    <text x="0" y="28" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'JetBrains Mono', sans-serif" font-size="84" font-weight="900" fill="#ffffff" text-anchor="middle">₫</text>
  </g>

  <!-- Trend Growth Wave Indicator Overlay -->
  <path d="M 220 740 
           Q 360 620, 500 660 
           T 780 440" 
        fill="none" 
        stroke="#38d9a9" 
        stroke-width="12" 
        stroke-linecap="round" 
        filter="url(#glowEffect)"/>
  
  <circle cx="780" cy="440" r="16" fill="#fff" filter="url(#glowEffect)"/>
  <circle cx="780" cy="440" r="8" fill="#38d9a9"/>

  <!-- Glass Specular Highlight -->
  <path d="M 300 400 L 300 680" stroke="rgba(255,255,255,0.4)" stroke-width="12" stroke-linecap="round"/>
  <path d="M 330 400 L 330 500" stroke="rgba(255,255,255,0.2)" stroke-width="6" stroke-linecap="round"/>

  <!-- App Title Label Badge -->
  <text x="512" y="890" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-size="44" font-weight="800" fill="#e0e5ec" letter-spacing="4" text-anchor="middle">CALTDHY</text>
</svg>
