<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" fill="none" role="img" aria-label="CaltDHy Logo — Full Detail (48px+)">
  <defs>
    <linearGradient id="caltdhy-bg" x1="64" y1="24" x2="448" y2="496" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#135E47"/>
      <stop offset="100%" stop-color="#0E4D3A"/>
    </linearGradient>
    <clipPath id="wallet-front-clip">
      <path d="M 104 214 C 104 229 114 238 130 238 L 365 238 Q 390.5 238 390.5 263 L 390.5 398 Q 390.5 436 352.5 436 L 142 436 Q 104 436 104 398 Z"/>
    </clipPath>
  </defs>

  <!-- Squircle App Icon Background (Deep Forest Emerald — crisp edge on all 4 themes) -->
  <rect x="0" y="0" width="512" height="512" rx="116" fill="url(#caltdhy-bg)"/>

  <!-- Layer 1: Wallet Back Pocket Opening (recessed dark interior) -->
  <path d="M 104 226 L 104 214 Q 104 192 128 192 L 350 192 Q 373 192 373 215 L 373 244 L 104 244 Z"
        fill="#0B3D2E" stroke="#10281C" stroke-width="10.5" stroke-linejoin="round"/>

  <!-- Layer 2: Mouse Peeking Out (exact structure preserved from reference) -->
  <path d="M 151.5 242 Q 154.5 198 165.5 171.5 A 48 48 0 1 1 213.3 127.8 Q 250.5 113.5 287.7 127.8 A 48 48 0 1 1 335.5 171.5 Q 346.5 198 349.5 242 Z"
        fill="#F5F1E3" stroke="#10281C" stroke-width="10.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Mouse Face: Eyes & Rounded-Triangle Nose -->
  <circle cx="211.5" cy="189" r="9.4" fill="#10281C"/>
  <circle cx="289.5" cy="189" r="9.4" fill="#10281C"/>
  <path d="M 239 204.5 Q 250.5 200.5 262 204.5 Q 263.4 207 259.2 212.8 Q 253.8 219 250.5 219 Q 247.2 219 241.8 212.8 Q 237.6 207 239 204.5 Z"
        fill="#10281C"/>

  <!-- Layer 3: Wallet Front Body (Bright Mint-Emerald — lighter than background for crisp separation) -->
  <path d="M 104 214 C 104 229 114 238 130 238 L 365 238 Q 390.5 238 390.5 263 L 390.5 398 Q 390.5 436 352.5 436 L 142 436 Q 104 436 104 398 Z"
        fill="#54B48C"/>

  <!-- Subtle Tactile Shadow Beneath Clasp Tab (matching reference depth) -->
  <g clip-path="url(#wallet-front-clip)">
    <path d="M 337 314 L 404 314 L 404 388 L 337 388 A 37 37 0 0 1 337 314 Z"
          fill="#2F7F60" fill-opacity="0.42"/>
  </g>

  <!-- Wallet Front Body Crisp Outline -->
  <path d="M 104 214 C 104 229 114 238 130 238 L 365 238 Q 390.5 238 390.5 263 L 390.5 398 Q 390.5 436 352.5 436 L 142 436 Q 104 436 104 398 Z"
        fill="none" stroke="#10281C" stroke-width="10.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Layer 4: Wallet Clasp Tab -->
  <path d="M 337 302 L 396 302 Q 408 302 408 314 L 408 362 Q 408 374 396 374 L 337 374 A 36 36 0 0 1 337 302 Z"
        fill="#398F6C" stroke="#10281C" stroke-width="10.5" stroke-linejoin="round"/>

  <!-- Layer 5: Warm Golden Coin Clasp -->
  <circle cx="337" cy="338" r="23" fill="#F0B43B"/>
  <circle cx="337" cy="338" r="16" stroke="#FCE394" stroke-width="2.5" stroke-opacity="0.8"/>
</svg>
